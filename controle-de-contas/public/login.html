<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Controle de Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --painel: #161b22;
    --borda: #232a36;
    --texto: #f3f4f6;
    --texto-suave: #9aa3b2;
    --teal: #2dd4bf;
    --coral: #fb7373;
    --amarelo: #f5c518;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--texto);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .caixa {
    width: 100%;
    max-width: 360px;
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 18px;
    padding: 36px 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .marca {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .marca img {
    width: 56px;
    height: 56px;
    border-radius: 14px;
  }

  .marca span {
    font-size: 18px;
    font-weight: 800;
  }

  .marca span .destaque { color: var(--amarelo); }

  h1 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 22px;
  }

  #erro {
    background: rgba(251, 115, 115, 0.1);
    border: 1px solid rgba(251, 115, 115, 0.3);
    color: var(--coral);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
    display: none;
  }

  #erro.visivel { display: block; }

  label {
    display: block;
    font-size: 12px;
    color: var(--texto-suave);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .campo { margin-bottom: 16px; }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--borda);
    background: #0d1117;
    color: var(--texto);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
  }

  input:focus {
    outline: none;
    border-color: var(--teal);
  }

  button#btnPrincipal {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--teal);
    color: #062825;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
  }

  button#btnPrincipal:hover { background: #5eead4; }
  button#btnPrincipal:disabled { opacity: 0.6; cursor: default; }

  .alternar {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--texto-suave);
    font-size: 13px;
    text-align: center;
    margin-top: 18px;
    cursor: pointer;
  }

  .alternar strong { color: var(--amarelo); font-weight: 700; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="marca">
      <img src="logo.png" alt="Logo Controle de Contas">
      <span>Controle de <span class="destaque">Contas</span></span>
    </div>

    <h1 id="titulo">Entrar na sua conta</h1>
    <div id="erro"></div>

    <div class="campo">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username" placeholder="seu.usuario">
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button id="btnPrincipal">Entrar</button>
    <button class="alternar" id="btnAlternar">Não tem conta? <strong>Cadastre-se</strong></button>
  </div>

<script>
  let modoCadastro = false;
  const titulo = document.getElementById('titulo');
  const btnPrincipal = document.getElementById('btnPrincipal');
  const btnAlternar = document.getElementById('btnAlternar');
  const erroEl = document.getElementById('erro');

  btnAlternar.addEventListener('click', () => {
    modoCadastro = !modoCadastro;
    titulo.textContent = modoCadastro ? 'Criar sua conta' : 'Entrar na sua conta';
    btnPrincipal.textContent = modoCadastro ? 'Cadastrar' : 'Entrar';
    btnAlternar.innerHTML = modoCadastro
      ? 'Já tem conta? <strong>Entrar</strong>'
      : 'Não tem conta? <strong>Cadastre-se</strong>';
    erroEl.classList.remove('visivel');
  });

  btnPrincipal.addEventListener('click', async () => {
    erroEl.classList.remove('visivel');
    const usuario = document.getElementById('usuario').value.trim();
    const senha = document.getElementById('senha').value;
    const rota = modoCadastro ? '/api/registrar' : '/api/login';

    btnPrincipal.disabled = true;
    btnPrincipal.textContent = modoCadastro ? 'Cadastrando...' : 'Entrando...';

    try {
      const resp = await fetch(rota, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, senha }),
      });
      const dados = await resp.json();
      if (!resp.ok) {
        erroEl.textContent = dados.erro || 'Erro ao processar';
        erroEl.classList.add('visivel');
        btnPrincipal.disabled = false;
        btnPrincipal.textContent = modoCadastro ? 'Cadastrar' : 'Entrar';
        return;
      }
      window.location.href = '/';
    } catch (e) {
      erroEl.textContent = 'Erro de conexão com o servidor';
      erroEl.classList.add('visivel');
      btnPrincipal.disabled = false;
      btnPrincipal.textContent = modoCadastro ? 'Cadastrar' : 'Entrar';
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
